<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="markdown-rtl-arch-title markdown-rtl-arch-desc">
  <title id="markdown-rtl-arch-title">Markdown RTL System Architecture</title>
  <desc id="markdown-rtl-arch-desc">Architecture diagram illustrating Markdown RTL components across IDE Platform, Preview Bridge, and JCEF Preview DOM runtime.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0284c7"/></marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="8" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">MARKDOWN RTL · ARCHITECTURE</text>
  <text x="40" y="60" fill="#2d3142" font-size="20" font-family="'Instrument Serif', Georgia, serif" font-weight="400">Plugin &amp; Preview Architecture</text>

  <!-- Zones (drawn before arrows and nodes) -->
  <!-- Zone 1: IDE Platform -->
  <rect x="36" y="88" width="264" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="52" y="84" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="108" y="93" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IDE PLATFORM</text>

  <!-- Zone 2: Preview Bridge -->
  <rect x="336" y="88" width="272" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="352" y="84" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="416" y="93" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PREVIEW BRIDGE</text>

  <!-- Zone 3: JCEF Runtime -->
  <rect x="644" y="88" width="280" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="660" y="84" width="144" height="12" rx="2" fill="#ffffff"/>
  <text x="732" y="93" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">JCEF PREVIEW DOM</text>

  <!-- Arrows (drawn before nodes) -->
  <!-- 1. Node 1A to Node 1B (Vertical straight) -->
  <line x1="168" y1="192" x2="168" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2. Node 1B to Node 2A (Orthogonal: Settings -> Extension) -->
  <path d="M 268,268 H 312 Q 320,268 320,260 V 168 Q 320,160 328,160 H 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3. Node 2B to Node 1B (Horizontal straight: Pipe -> Settings) -->
  <line x1="372" y1="288" x2="268" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4. Node 2A to Node 2B (Vertical straight: Extension -> Pipe) -->
  <line x1="472" y1="192" x2="472" y2="256" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- 5. Node 2A to Node 3B (Orthogonal: Extension -> DOM CSS/JS) -->
  <path d="M 572,160 H 620 Q 628,160 628,168 V 228 Q 628,236 636,236 H 680" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- 6. Node 3A to Node 2B (Orthogonal: Bento -> Pipe IPC) -->
  <path d="M 680,138 H 604 Q 596,138 596,146 V 268 Q 596,276 588,276 H 572" fill="none" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- 7. Node 3A to Node 3B (Vertical straight: Bento live update DOM) -->
  <line x1="780" y1="168" x2="780" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 8. Node 3C to Node 3B (Vertical straight dashed: Fonts -> CSS) -->
  <line x1="780" y1="304" x2="780" y2="268" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow labels with masks -->
  <!-- Label 1: TRIGGER (beside vertical line at x=168, 8px gap) -->
  <rect x="176" y="218" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="200" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>

  <!-- Label 2: NOTIFY (beside vertical segment at x=320, 8px gap) -->
  <rect x="268" y="208" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="290" y="217" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTIFY</text>

  <!-- Label 3: PERSIST (above horizontal line at y=288, 6px gap) -->
  <rect x="296" y="270" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="320" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSIST</text>

  <!-- Label 4: LISTEN (beside vertical line at x=472, 8px gap) -->
  <rect x="480" y="218" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="502" y="227" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LISTEN</text>

  <!-- Label 5: INJECT (beside vertical segment at x=628, 8px gap) -->
  <rect x="636" y="192" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="656" y="201" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INJECT</text>

  <!-- Label 6: POST MSG (beside vertical segment at x=596, 8px gap) -->
  <rect x="536" y="192" width="52" height="12" rx="2" fill="#ffffff"/>
  <text x="562" y="201" fill="#0284c7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST MSG</text>

  <!-- Label 7: LIVE CSS (beside vertical line at x=780, 8px gap) -->
  <rect x="788" y="180" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="812" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIVE CSS</text>

  <!-- Label 8: BASE64 (beside vertical line at x=780, 8px gap) -->
  <rect x="788" y="280" width="44" height="12" rx="2" fill="#ffffff"/>
  <text x="810" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASE64</text>

  <!-- Node Boxes and Contents -->
  <!-- Node 1A: Toggle Action -->
  <rect x="68" y="128" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="68" y="128" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.24)" stroke-width="1"/>
  <rect x="76" y="136" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text x="96" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTION</text>
  <text x="168" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Toggle Action</text>
  <text x="168" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Keyboard · Menu · ⌥R</text>

  <!-- Node 1B: Settings Service -->
  <rect x="68" y="256" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="68" y="256" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="76" y="264" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="96" y="273" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONFIG</text>
  <text x="168" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Settings Service</text>
  <text x="168" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Persisted XML · Topic</text>

  <!-- Node 2A: Browser Extension (Focal Coral) -->
  <rect x="372" y="128" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="372" y="128" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="380" y="136" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="396" y="145" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="560" y="184" fill="rgba(235,108,54,0.12)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
  <text x="472" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser Extension</text>
  <text x="472" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Markdown Preview Provider</text>

  <!-- Node 2B: BrowserPipe IPC -->
  <rect x="372" y="256" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="372" y="256" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="380" y="264" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="400" y="273" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRIDGE</text>
  <text x="472" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BrowserPipe IPC</text>
  <text x="472" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pmUpdateSettings · 2-Way</text>

  <!-- Node 3A: Bento Controller (Focal Coral) -->
  <rect x="680" y="108" width="200" height="60" rx="6" fill="#ffffff"/>
  <rect x="680" y="108" width="200" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="688" y="116" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="700" y="125" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
  <text x="868" y="160" fill="rgba(235,108,54,0.12)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
  <text x="780" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bento Controller</text>
  <text x="780" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Floating Capsule · Controls</text>

  <!-- Node 3B: BiDi Engine & CSS -->
  <rect x="680" y="204" width="200" height="64" rx="6" fill="#ffffff"/>
  <rect x="680" y="204" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <rect x="688" y="212" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
  <text x="708" y="221" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
  <text x="780" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BiDi Engine &amp; CSS</text>
  <text x="780" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Auto RTL · Code Isolation</text>

  <!-- Node 3C: Embedded Fonts -->
  <rect x="680" y="304" width="200" height="60" rx="6" fill="#ffffff"/>
  <rect x="680" y="304" width="200" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="688" y="312" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="706" y="321" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASSET</text>
  <text x="780" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Embedded Fonts</text>
  <text x="780" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Vazirmatn · JetBrains Mono</text>

  <!-- Legend -->
  <line x1="40" y1="408" x2="920" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>

  <rect x="40" y="434" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="60" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core / UI (Focal)</text>

  <rect x="180" y="434" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="200" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Platform Service</text>

  <rect x="320" y="434" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="340" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Runtime / Engine</text>

  <line x1="470" y1="439" x2="498" y2="439" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="506" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary Pipeline</text>

  <line x1="620" y1="439" x2="648" y2="439" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="656" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Two-Way IPC</text>

  <line x1="750" y1="439" x2="778" y2="439" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="786" y="442" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Asset / Font-face</text>
</svg>
